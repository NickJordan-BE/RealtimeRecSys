
networks:
  kafka-net:
    driver: bridge

services:
  kafka1:
    image: apache/kafka:4.3.1
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092" # broker process
      - "9093:9093" # controller process
    environment:
      KAFKA_NODE_ID: 1 # Unique ID
      KAFKA_BROKER_ID: 1 # Legacy UUID
      KAFKA_PROCESS_ROLES: 'broker,controller' 
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093' # List of controller voters + addresses
      KAFKA_LISTENERS: 'PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093' # Accepts incoming broker (PLAINTEXT: This is a name) + controller (CONTROLLER) connections
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092' # Tells the client where to send data (essentially localhost or this kafka service's broker address)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT' # Encrypted or non-encrypted comms
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'b8642c09-26d0-4d7e-a1e9-0b74d075e37c'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 # Sets replication for __consumer_offsets topics which manages consumed messages
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # Delay for consumer rebalances
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # Replication factor for topics (fault tolerance)
      KAFKA_MIN_INSYNC_REPLICAS: 2 # Min # of brokers that need to ack a write for it to be committed (Durability + Write Availability)
    volumes:
      - ./kafka1/data:/var/lib/kafka/data
    networks:
      - kafka-net
      
  kafka2:
    image: apache/kafka:4.3.1
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9094:9092" # broker process
      - "9095:9093" # controller process
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka2:9092,CONTROLLER://kafka2:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'b8642c09-26d0-4d7e-a1e9-0b74d075e37c'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - ./kafka2/data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka3:
    image: apache/kafka:4.3.1
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9096:9092" # broker process
      - "9097:9093" # controller process
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_BROKER_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka3:9092,CONTROLLER://kafka3:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka3:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'b8642c09-26d0-4d7e-a1e9-0b74d075e37c'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - ./kafka3/data:/var/lib/kafka/data
    networks:
      - kafka-net
  
  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: kafka-cluster-ui
      ports:
        - "8080:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      depends_on:
        - kafka1
        - kafka2
        - kafka3
      networks:
        - kafka-net